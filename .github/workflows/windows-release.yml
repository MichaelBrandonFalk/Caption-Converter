name: Build Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build app bundle
        run: |
          pyinstaller --noconfirm --windowed --onedir --name "Caption Converter" --icon Contents/Resources/AppIcon.icns --paths src app.py

      - name: Archive app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/Caption Converter.app" "dist/Caption-Converter-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS Apple Silicon
          path: dist/Caption-Converter-macos-arm64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --windowed --onefile --name "Caption Converter" --paths src app.py

      - name: Zip build
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist/Caption Converter.exe' -DestinationPath 'dist/Caption-Converter-windows-x64.zip'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows x64
          path: dist/Caption-Converter-windows-x64.zip

  build-linux:
    # Mint 21 uses Ubuntu 22.04; building here also supports Mint 22's newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk binutils

      - name: Build Linux Mint installer
        run: sh scripts/build_linux_mint.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux Mint x64
          path: dist/Caption-Converter-linux-mint-amd64.deb

  verify-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: Linux Mint x64
          path: installer

      - name: Install package and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ./installer/Caption-Converter-linux-mint-amd64.deb xvfb xauth desktop-file-utils

      - name: Verify packaged conversion and GUI startup
        run: |
          set -eu
          package_dir="$(mktemp -d)"
          desktop-file-validate /usr/share/applications/caption-converter.desktop
          app=caption-converter
          "$app" --help
          printf '1\n00:00:01,000 --> 00:00:03,000\nHello Linux Mint!\n\n' > "$package_dir/sample.srt"
          "$app" --to-vtt --to-ttml "$package_dir/sample.srt"
          grep -q 'WEBVTT' "$package_dir/sample.vtt"
          grep -q 'Hello Linux Mint!' "$package_dir/sample.vtt"
          grep -q 'Hello Linux Mint!' "$package_dir/sample.ttml"
          set +e
          xvfb-run -a timeout 10s "$app" --gui > "$package_dir/gui.log" 2>&1
          status=$?
          set -e
          cat "$package_dir/gui.log"
          test "$status" -eq 124
          ! grep -Ei 'Traceback|TclError|Failed to' "$package_dir/gui.log"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos, build-windows, build-linux, verify-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
